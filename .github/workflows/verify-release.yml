name: Verify and package SceneTrace
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test and runtime dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install maintained Linux media runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Functional tests, including actual HTTP and media processing
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Measure media library indexing
        run: python scripts/library_benchmark.py
      - name: Source application process smoke test
        run: python scripts/smoke.py
      - name: Build self-contained Windows package
        if: runner.os == 'Windows'
        run: python scripts/build.py
      - name: Smoke the actual packaged executable
        if: runner.os == 'Windows'
        run: python scripts/smoke.py --exe dist/SceneTrace/SceneTrace.exe
      - name: Exercise actual packaged native browser, isolation, playback and restart
        if: runner.os == 'Windows'
        run: python scripts/windows_browser_check.py
      - name: Real public source verification
        run: python scripts/live_check.py
      - name: Diagnose live website search and deep catalog retrieval
        run: python scripts/v4_live_check.py
      - name: Complete a public episode download using the packaged executable
        if: runner.os == 'Windows'
        run: python scripts/live_video_check.py --exe dist/SceneTrace/SceneTrace.exe
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: runner.os == 'Windows'
      - run: npx playwright install chromium --only-shell
        if: runner.os == 'Windows'
      - name: Play a real episode in the packaged Windows application
        if: runner.os == 'Windows'
        env:
          SCENETRACE_QA_EXE: dist/SceneTrace/SceneTrace.exe
        run: node scripts/video-e2e.cjs
      - name: Stage Windows ZIP and notices
        if: runner.os == 'Windows'
        run: python scripts/package_release.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ runner.os }}
          path: |
            test-results.xml
            live-results.json
            watch-results.json
      - name: Upload Windows search and playback screenshots
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-watch-qa
          path: artifacts/
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SceneTrace-Windows-x64
          path: |
            SceneTrace-Windows-x64.zip
            SceneTrace-Windows-x64.sha256
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install chromium --with-deps --only-shell
      - name: Verify real search-to-watch workflows
        run: node scripts/video-e2e.cjs
      - name: Exercise the real browser application
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-layouts
          path: artifacts/
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SceneTrace-Windows-x64
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: windows-watch-qa
          path: screens
      - name: Publish verified Windows prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v4.1.0-rc.$GITHUB_RUN_NUMBER"
          gh release create "$tag" package/SceneTrace-Windows-x64.zip package/SceneTrace-Windows-x64.sha256 screens/anime-search.png screens/caminandes-playing.png screens/added-website-playing.png screens/native-browser/native-browser-playing.png --target "$GITHUB_SHA" --title "SceneTrace 4.1 · Windows release candidate" --prerelease --notes-file docs/RELEASE-NOTES.md
