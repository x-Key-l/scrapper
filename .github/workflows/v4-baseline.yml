name: SceneTrace 4 baseline and HiAnime diagnosis
on:
  push:
    branches: [build/intelligent-browser-v4]
    paths: ['scripts/v4_audit.py', '.github/workflows/v4-baseline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 5383d468d3ce0fe2c21e2b86f80636399707869b
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r baseline/requirements.txt psutil==7.0.0
      - run: python scripts/v4_audit.py --root baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v4-baseline-${{ runner.os }}
          path: artifacts/v4-baseline/
