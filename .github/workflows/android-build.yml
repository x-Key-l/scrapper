name: Android build and WebView checks

on:
  push:
    branches: [codex/scenetrace-android]
    paths: ['android/**', '.github/workflows/android-build.yml', 'native/Filters/**']
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml', 'native/Filters/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Check bundled filter and license against Windows source
        run: |
          set -o pipefail
          base64 --decode ../native/Filters/light.txt.gz.b64 | cmp - app/src/main/assets/hagezi-light.txt.gz
          cmp ../native/Filters/LICENSE-HaGeZi.txt app/src/main/assets/LICENSE-HaGeZi.txt
      - run: ./gradlew --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: SceneTrace-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: android/app/build/reports/tests/testDebugUnitTest/
  device:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          working-directory: android
          script: ./gradlew --stacktrace connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-tests
          path: android/app/build/reports/androidTests/connected/
