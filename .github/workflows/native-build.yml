name: WebView2 native host compile
on:
  push:
    branches: [build/intelligent-browser-v4]
    paths: ['native/**', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build native/SceneTrace.Browser.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: native-browser-compile
          path: native/bin/Release/net48/
